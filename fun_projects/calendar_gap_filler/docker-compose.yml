# Personal deployment (decision #9): local-only. This runs the app in a
# container for a consistent, one-command way to start it — it is not
# exposed beyond this machine (see the port binding below). No tunnel,
# no domain, no public URL: the real calendar-derived data never leaves
# this Mac.
services:
  app:
    build: .
    restart: unless-stopped
    # TICKETMASTER_API_KEY / USER_LATITUDE / USER_LONGITUDE /
    # USER_SEARCH_RADIUS_KM — same .env this app already reads locally
    # (config.py's load_dotenv() becomes a no-op inside the container
    # since there's no .env file there; env_file supplies the same
    # variables directly, no code changes needed).
    env_file: .env
    volumes:
      # token.json and feedback.db are written to, not just read (token
      # refreshes, new feedback rows) — bind-mounted (not baked into the
      # image) so writes land back on the host and survive container
      # restarts. profile.json is read-only from the app's side.
      #
      # credentials.json is deliberately NOT mounted: it's only used by
      # calendar_module.client._load_credentials() to start a *new*
      # interactive browser login, and api/main.py's guard (decision #1)
      # already returns 503 before calling into the orchestrator at all
      # when token.json is missing — so that code path is never reached
      # here. If token.json ever becomes invalid in some way other than
      # "expired with a refresh_token" (narrow edge case), this would
      # surface as an unhandled error instead of the InstalledAppFlow
      # trying to open a browser inside a headless container anyway,
      # which is not more helpful. Re-run a CLI script locally to
      # regenerate token.json if that ever happens.
      - ./token.json:/app/token.json
      - ./profile.json:/app/profile.json:ro
      - ./feedback.db:/app/feedback.db
    # Bound to 127.0.0.1 only, on purpose: this is the entire access
    # control (decision #9 revised — no tunnel, no VPN, no domain). Only
    # this same machine can reach the container at all; binding
    # "0.0.0.0:8000:8000" instead would make it reachable from the whole
    # local network, which is more than "this Mac only" calls for.
    ports:
      - "127.0.0.1:8000:8000"
